<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remy moreau</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  #box {
    position: absolute;
    left: 0; top: 0;
    text-align: center;
    color: #000;
    padding: 8px 12px;
    white-space: nowrap;
    line-height: 1.4;
    font-size: 24px;
  }
</style>
</head>
<body>
<div id="box">
  remy moreau<br>
  creator of stuff<br>
  he/him<br>
  ~𖥔☾𖤓☽𖥔~
</div>
<script>
  const box = document.getElementById("box");
  let x = 50, y = 50, dx = 2, dy = 2;
  const colors = ["#000000"];
  let c = 0;

  function recolor() {
    c = (c + 1) % colors.length;
    box.style.color = colors[c];
  }

  function tick() {
    const w = box.offsetWidth, h = box.offsetHeight;
    x += dx; y += dy;
    if (x <= 0)                    { x = 0;                   dx = Math.abs(dx);  recolor(); }
    if (x + w >= innerWidth)       { x = innerWidth - w;      dx = -Math.abs(dx); recolor(); }
    if (y <= 0)                    { y = 0;                   dy = Math.abs(dy);  recolor(); }
    if (y + h >= innerHeight)      { y = innerHeight - h;     dy = -Math.abs(dy); recolor(); }
    box.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
