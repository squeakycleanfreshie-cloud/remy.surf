<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remy moreau</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  #box {
    position: absolute;
    left: 0; top: 0;
    text-align: center;
    color: #000;
    padding: 8px 12px;
    white-space: nowrap;
    line-height: 1.4;
    font-size: 24px;
  }
</style>
</head>
<body>
<div id="box">
  remy moreau<br>
  creator of stuff<br>
  he/him<br>
  ~𖥔☾𖤓☽𖥔~
</div>
<script>
  const box = document.getElementById("box");
  let x = 50, y = 50, dx = 2, dy = 2;
  let paused = false, clicks = 0, clickTimer;
  const colors = ["#000000"];
  let c = 0;

  function recolor() {
    c = (c + 1) % colors.length;
    box.style.color = colors[c];
  }

  function tick() {
    const w = box.offsetWidth, h = box.offsetHeight;
    if (!paused) { x += dx; y += dy; }
    let hitX = false, hitY = false;
    if (x <= 0)               { x = 0;               dx = Math.abs(dx);  hitX = true; recolor(); }
    if (x + w >= innerWidth)  { x = innerWidth - w;  dx = -Math.abs(dx); hitX = true; recolor(); }
    if (y <= 0)               { y = 0;               dy = Math.abs(dy);  hitY = true; recolor(); }
    if (y + h >= innerHeight) { y = innerHeight - h; dy = -Math.abs(dy); hitY = true; recolor(); }
    if (hitX && hitY) { window.location.href = "corner.html"; return; }
    box.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(tick);
  }
  tick();

  // pause while hovering so it's easy to click
  box.style.cursor = "pointer";
  box.addEventListener("mouseenter", () => paused = true);
  box.addEventListener("mouseleave", () => paused = false);

  // 3 clicks -> albums page
  box.addEventListener("click", () => {
    clicks++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => clicks = 0, 800);
    if (clicks >= 3) window.location.href = "albums.html";
  });
</script>
</body>
</html>
