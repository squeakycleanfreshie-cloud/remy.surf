<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen's Cooking</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    background: #1b1410;
    color: #fff4e0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
  }
  img {
    max-width: min(90vw, 480px);
    max-height: 60vh;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 5vw, 3rem);
    line-height: 1.2;
  }
</style>
</head>
<body>
  <img src="https://i.pinimg.com/originals/2a/be/e3/2abee308c28312f2450fdfa10d041f0c.gif" alt="Cooking animation">
  <h1>Kitchen is cooking up some good stuff</h1>
</body>
</html>
