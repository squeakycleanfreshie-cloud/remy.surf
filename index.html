<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remy moreau</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  #box, .copy {
    position: absolute;
    left: 0; top: 0;
    text-align: center;
    color: #000;
    padding: 8px 12px;
    white-space: nowrap;
    line-height: 1.4;
    font-size: 24px;
  }
</style>
</head>
<body>
<div id="box">
  remy moreau<br>
  creator of stuff<br>
  he/him<br>
  ~𖥔☾𖤓☽𖥔~
</div>
<script>
  const box = document.getElementById("box");
  let x = 20 + Math.random() * 300, y = 20 + Math.random() * 150, dx = 2, dy = 1.6;
  let paused = false, clicks = 0, clickTimer, state = 0; // 0 normal, 1 r pressed (waiting for wall), 2 aimed at corner
  const colors = ["#000000"];
  let c = 0;

  function recolor() {
    c = (c + 1) % colors.length;
    box.style.color = colors[c];
  }

  function tick() {
    const w = box.offsetWidth, h = box.offsetHeight;
    if (!paused) { x += dx; y += dy; }
    let hitX = false, hitY = false;
    if (x <= 0)               { x = 0;               dx = Math.abs(dx);  hitX = true; recolor(); }
    if (x + w >= innerWidth)  { x = innerWidth - w;  dx = -Math.abs(dx); hitX = true; recolor(); }
    if (y <= 0)               { y = 0;               dy = Math.abs(dy);  hitY = true; recolor(); }
    if (y + h >= innerHeight) { y = innerHeight - h; dy = -Math.abs(dy); hitY = true; recolor(); }
    const go = () => { window.location.href = "corner.html"; };
    if ((hitX && hitY) || (state === 2 && (hitX || hitY))) { go(); return; }
    if (state === 1 && (hitX || hitY)) {
      // just bounced off a wall: now aim at the corner it's heading toward, same speed
      const tx = dx > 0 ? innerWidth - w : 0;
      const ty = dy > 0 ? innerHeight - h : 0;
      const vx = tx - x, vy = ty - y;
      const d = Math.hypot(vx, vy), speed = Math.hypot(dx, dy);
      if (d < 1) { go(); return; }
      dx = vx / d * speed;
      dy = vy / d * speed;
      state = 2;
    }
    box.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(tick);
  }
  tick();

  // pause while hovering so it's easy to click
  box.style.cursor = "pointer";
  box.addEventListener("mouseenter", () => paused = true);
  box.addEventListener("mouseleave", () => paused = false);

  // 3 clicks -> albums page
  box.addEventListener("click", () => {
    clicks++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => clicks = 0, 800);
    if (clicks >= 3) window.location.href = "albums.html";
  });

  // press r -> after the next wall bounce, it heads straight into a corner
  document.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "r" && state === 0) state = 1;
  });

  // konami code (up up down down left right left right b a) -> lots of copies, again to clear
  const seq = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
  let pos = 0, copies = [];

  function toggleCopies() {
    if (copies.length) { copies.forEach(c => c.el.remove()); copies = []; return; }
    for (let i = 0; i < 25; i++) {
      const el = box.cloneNode(true);
      el.removeAttribute("id");
      el.className = "copy";
      el.style.cursor = "default";
      document.body.appendChild(el);
      copies.push({
        el,
        x: Math.random() * Math.max(innerWidth - el.offsetWidth, 1),
        y: Math.random() * Math.max(innerHeight - el.offsetHeight, 1),
        dx: (1 + Math.random() * 2) * (Math.random() < 0.5 ? -1 : 1),
        dy: (1 + Math.random() * 2) * (Math.random() < 0.5 ? -1 : 1)
      });
    }
  }

  function moveCopies() {
    copies.forEach(c => {
      const w = c.el.offsetWidth, h = c.el.offsetHeight;
      c.x += c.dx; c.y += c.dy;
      if (c.x <= 0)              { c.x = 0;              c.dx = Math.abs(c.dx); }
      if (c.x + w >= innerWidth) { c.x = innerWidth - w; c.dx = -Math.abs(c.dx); }
      if (c.y <= 0)              { c.y = 0;              c.dy = Math.abs(c.dy); }
      if (c.y + h >= innerHeight){ c.y = innerHeight - h; c.dy = -Math.abs(c.dy); }
      c.el.style.transform = `translate(${c.x}px, ${c.y}px)`;
    });
    requestAnimationFrame(moveCopies);
  }
  moveCopies();

  document.addEventListener("keydown", (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    pos = (k === seq[pos]) ? pos + 1 : (k === seq[0] ? 1 : 0);
    if (pos === seq.length) { pos = 0; toggleCopies(); }
  });
</script>
</body>
</html>
