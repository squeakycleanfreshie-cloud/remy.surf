<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>albums</title>
<style>
  body { margin: 0; background: #fff; color: #000; }
  #back { position: fixed; top: 8px; left: 8px; color: #000; background: #fff; padding: 2px 8px; z-index: 1; }
  #grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0;
    width: 100%;
    margin: 0;
  }
  #grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
</style>
</head>
<body>
<a id="back" href="index.html">&larr; back</a>
<div id="grid"></div>
<script>
  // 25 albums. put your image path in img (e.g. "albums/1.jpg"). leave "" for a placeholder.
  const albums = [
    { title: "album 1",  img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPDNmj3BNusDk6xYo9uIjea7yXbSLjLPQ5meH1-1qk8A&s=10" },
    { title: "album 2",  img: "https://media.pitchfork.com/photos/6aa07d0735fd7ba3dfde3039/1:1/w_450%2Cc_limit/Adela%2520-%2520Prima%2520album%2520art.jpg" },
    { title: "album 3",  img: "https://i.scdn.co/image/ab67616d0000b2734c6a0c9499470002aa8ba96f" },
    { title: "album 4",  img: "https://upload.wikimedia.org/wikipedia/en/5/5b/PinkPantheress_-_Fancy_That.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" },
    { title: "album 5",  img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTn0rB7QmCH4nw2CWdr1oOqEAA5FK9r7oRpfYnbdsz0AoFr0qj7bgZ1vmg&s=10" },
    { title: "album 6",  img: "https://media.pitchfork.com/photos/5df3c008b91d230008bf3846/master/pass/bubba.jpeg" },
    { title: "album 7",  img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBptZr5tV4n1r66xR77JCcBFipQBwUKSWjPWFU4K7JAmotKTqAsFLMMw1H&s=10" },
    { title: "album 8",  img: "" },
    { title: "album 9",  img: "" },
    { title: "album 10", img: "" },
    { title: "album 11", img: "" },
    { title: "album 12", img: "" },
    { title: "album 13", img: "" },
    { title: "album 14", img: "" },
    { title: "album 15", img: "" },
    { title: "album 16", img: "" },
    { title: "album 17", img: "" },
    { title: "album 18", img: "" },
    { title: "album 19", img: "" },
    { title: "album 20", img: "" },
    { title: "album 21", img: "" },
    { title: "album 22", img: "" },
    { title: "album 23", img: "" },
    { title: "album 24", img: "" },
    { title: "album 25", img: "" }
  ];

  function placeholder(n) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#ddd"/><text x="50" y="57" font-size="22" text-anchor="middle" fill="#888">${n}</text></svg>`;
    return "data:image/svg+xml," + encodeURIComponent(svg);
  }

  const grid = document.getElementById("grid");
  albums.forEach((a, i) => {
    const img = document.createElement("img");
    img.src = a.img || placeholder(i + 1);
    img.alt = a.title;
    img.title = a.title;
    grid.appendChild(img);
  });
</script>
</body>
</html>
